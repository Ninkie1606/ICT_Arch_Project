version: "3.8"

services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    secrets:
      - minio_password
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_nick}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - archief_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s

  postgres:
    image: postgres:15-alpine
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nick_archivaris}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-history_metadata_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - archief_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s

  pgadmin:
    image: dpage/pgadmin4
    secrets:
      - pgadmin_password
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    ports:
      - "8080:80"
    networks:
      - archief_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 30s

secrets:
  minio_password:
    external: true
  postgres_password:
    external: true
  pgadmin_password:
    external: true

networks:
  archief_net:
    driver: overlay

volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
